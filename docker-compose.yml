services:

  mysql-farmacia:   # Servicio para DDBB
    image: mysql:8.0.42
    container_name: mysql-farmacia
    restart: unless-stopped
    environment:
      MYSQL_USER: dev
      MYSQL_PASSWORD: 1234 
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: sistemastock
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb/:/docker-entrypoint-initdb.d  # <- Carpeta local mapeada
    networks:
      - app-network 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:   # Servicio para NestJS
    container_name: backend-farmacia
    build: ./backend  # Ruta a tu Dockerfile del backend
    ports:
      - "3000:3000"  # Mapeo de puertos (host:container)
    volumes:
      - ./backend:/app  # Monta el código fuente (para desarrollo)
      - /app/node_modules  # Excluye node_modules del volumen
    environment:
      NODE_ENV: test   # antes development
    command: npm run start:dev  # comando de inicio
    depends_on:
      - mysql-farmacia  # Espera a que MySQL esté listo    
    networks:
      - app-network 


  frontend:  # Servicio para Angular
    container_name: frontend-farmacia
    build: ./frontend       # Le dice a Docker que busque un Dockerfile en la carpeta ./frontend
    ports:
      - "4200:4200"       # Mapea el puerto 4200 del contenedor al 4200 de tu máquina
    volumes:
      - ./frontend:/app     # Monta código fuente local en /app dentro del contenedor.
                            # Esto permite que los cambios que hagas en tu código se reflejen al instante (hot-reloading).
      - /app/node_modules   # Un "volumen anónimo" que evita que tu node_modules local sobreescriba el del contenedor.
                            # Es una optimización importante para el rendimiento.
    depends_on:
      - backend           # asegura que el frontend no intente iniciar antes que el backend.
    networks:
      - app-network       # Conecta el frontend a la misma red que los otros servicios.

  test:
    container_name: backend-test
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      NODE_ENV: test
    depends_on:
      mysql-farmacia:
        condition: service_healthy
    networks:
      - app-network



volumes:
  mysql_data:


networks:
  app-network:
    driver: bridge