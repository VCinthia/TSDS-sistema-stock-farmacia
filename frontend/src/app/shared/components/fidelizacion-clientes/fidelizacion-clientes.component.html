<h1>Módulo de fidelización de clientes</h1>
<mat-card class="alertas-card">
    <mat-card-content>
        <div class="section-header">
            <h3>Reporte de clientes fidelizados</h3>
        </div>
        <div class="contenedorFiltro">
            <mat-form-field appearance="fill">
                <mat-label>Filtrar por categoría</mat-label>
                <select matNativeControl [(ngModel)]="categoriaSeleccionada" (change)="filtrarPorCategoria()">
                    <option value="">Todas</option>
                    <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
                </select>
            </mat-form-field>
        </div>

        <mat-card>
            <mat-table [dataSource]="clientesFiltrados" class="mat-elevation-z1">

                <ng-container matColumnDef="idCliente">
                    <mat-header-cell *matHeaderCellDef> Id Cliente </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.id}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="nombre">
                    <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.nombre}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="categoria">
                    <mat-header-cell *matHeaderCellDef> Categoría </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.categoria}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="puntos_fidelizacion">
                    <mat-header-cell *matHeaderCellDef> Puntos </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> ${{elemento.puntos_fidelizacion}} </mat-cell>
                </ng-container>


                <mat-header-row *matHeaderRowDef="columnas"></mat-header-row>
                <mat-row *matRowDef="let row; columns: columnas;"></mat-row>

            </mat-table>
        </mat-card>
        <!-- <div class="spinner" *ngIf="cargando">
            <mat-spinner diameter="60" color="accent"></mat-spinner>
            <p>Cargando datos...</p>
        </div> -->
    </mat-card-content>
</mat-card>
<div class="contenedorBotones">
    <app-boton-primario (click)="enviarPromociones()" [buttonText]="'Enviar promociones'"></app-boton-primario>
    <app-boton-primario (click)="exportarPDF()" [buttonText]="'Exportar PDF'"></app-boton-primario>
</div>
