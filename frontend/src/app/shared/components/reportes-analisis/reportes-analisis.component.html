<h1>Módulo de reportes y análisis</h1>
<mat-card class="alertas-card">
    <mat-card-content>
        <div class="section-header">
            <h3>Reporte de ventas</h3>
        </div>
        <div class="contenedorInputDate">
            <mat-form-field appearance="fill">
                <mat-label>Desde</mat-label>
                <input matInput [matDatepicker]="picker1" [(ngModel)]="fechaDesde" (dateChange)="filtrarVentas()"
                    name="fechaDesde">
                <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                <mat-datepicker #picker1></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Hasta</mat-label>
                <input matInput [matDatepicker]="picker2" [(ngModel)]="fechaHasta" (dateChange)="filtrarVentas()"
                    name="fechaHasta">
                <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                <mat-datepicker #picker2></mat-datepicker>
            </mat-form-field>
        </div>

        <mat-card>
            <mat-table [dataSource]="ventasFiltradas" class="mat-elevation-z1">

                <ng-container matColumnDef="idVenta">
                    <mat-header-cell *matHeaderCellDef> Id Venta </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.id_venta}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="fecha">
                    <mat-header-cell *matHeaderCellDef> Fecha </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.fecha | date:'dd-MM-yyyy'}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="sucursal">
                    <mat-header-cell *matHeaderCellDef> Sucursal </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> {{elemento.sucursal.direccion}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="precioTotal">
                    <mat-header-cell *matHeaderCellDef> Precio final </mat-header-cell>
                    <mat-cell *matCellDef="let elemento"> ${{elemento.total_final}} </mat-cell>
                </ng-container>


                <mat-header-row *matHeaderRowDef="columnas"></mat-header-row>
                <mat-row *matRowDef="let row; columns: columnas;"></mat-row>

            </mat-table>
        </mat-card>
        <div class="spinner" *ngIf="cargando">
            <mat-spinner diameter="60" color="accent"></mat-spinner>
            <p>Cargando datos...</p>
        </div>
    </mat-card-content>
</mat-card>
<div class="contenedorBoton">
    <app-boton-primario (click)="exportarPDF()" [buttonText]="'Exportar PDF'"></app-boton-primario>
</div>
