<h1>Módulo de ventas</h1>
<div class="contenedorBuscadorDni">
    <mat-form-field appearance="outline" class="inputBuscadorDni">
        <mat-label>DNI - CUIT</mat-label>
        <input matInput [(ngModel)]="dni">
    </mat-form-field>
    <div class="contenedorBotonLote">
        <app-boton-primario (click)="agregarRecetaElectronica()" [buttonText]="'Agregar receta electrónica'" class="botonAgregarDni"></app-boton-primario>
    </div>
</div>
<div class="contenedorBuscadorProducto">
    <mat-form-field appearance="outline" class="inputBuscadorProducto">
        <mat-label>Id o nombre del producto</mat-label>
        <input matInput [(ngModel)]="producto">
    </mat-form-field>
    <div class="contenedorBotonesSucursal">
        <app-boton-secundario [buttonText]="'Sucursal actual'"></app-boton-secundario>
        <app-boton-secundario [buttonText]="'Todas las sucursales'"></app-boton-secundario>
    </div>
</div>

<mat-card>
    <mat-table [dataSource]="dataSource" class="mat-elevation-z1">

        <ng-container matColumnDef="codigo">
            <mat-header-cell *matHeaderCellDef> Código </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.codigo}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="nombre">
            <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.nombre}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="categoria">
            <mat-header-cell *matHeaderCellDef> Categoría </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.categoria}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="stock">
            <mat-header-cell *matHeaderCellDef> Stock </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.stock}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="precio">
            <mat-header-cell *matHeaderCellDef> Precio </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.precio}} </mat-cell>
        </ng-container>

         <ng-container matColumnDef="cantidad">
            <mat-header-cell *matHeaderCellDef> Cantidad </mat-header-cell>
            <mat-cell *matCellDef="let elemento"> {{elemento.cantidad}} </mat-cell>
        </ng-container>
        
        <ng-container matColumnDef="accion">
      <mat-header-cell *matHeaderCellDef> Acción </mat-header-cell>
      <mat-cell *matCellDef="let elemento"> {{elemento.accion}} </mat-cell>
    </ng-container>

        <mat-header-row *matHeaderRowDef="columnas"></mat-header-row>
        <mat-row *matRowDef="let row; columns: columnas;"></mat-row>

    </mat-table>
</mat-card>
<div class="contenedorBotonEmitirFactura">
        <app-boton-primario (click)="emitirFactura()" [buttonText]="'Emitir factura'" class="botonEmitirFactura"></app-boton-primario>
</div>
