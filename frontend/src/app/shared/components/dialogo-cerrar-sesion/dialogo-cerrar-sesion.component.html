<h2 mat-dialog-title>Confirmar cierre de sesión</h2>
<mat-dialog-content style="font-size: 18px;">
    ¿Desea cerrar sesión?
</mat-dialog-content>
<mat-dialog-actions>
    <app-boton-secundario [buttonText]="'Cancelar'" (click)="dialogRef.close(false)"></app-boton-secundario>
    <app-boton-primario [buttonText]="'Cerrar sesión'" (click)="dialogRef.close(true)"></app-boton-primario>
</mat-dialog-actions>
